name: ci

on:
  push:
    branches: [ "main", "feat/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore German.sln
      - name: Build
        run: dotnet build German.sln --no-restore --configuration Release
      - name: Test
        run: dotnet test German.sln --no-build --configuration Release
