name: generate-initial-migration

on:
  push:
    branches: [ "feat/production-mvp" ]
    paths:
      - ".github/workflows/generate-initial-migration.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/production-mvp
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore German.sln
      - name: Install EF tool
        run: dotnet tool install --global dotnet-ef --version 10.0.10
      - name: Regenerate initial migration
        run: |
          rm -rf src/backend/German.Infrastructure/Persistence/Migrations
          dotnet ef migrations add InitialCreate \
            --project src/backend/German.Infrastructure \
            --startup-project src/backend/German.Api \
            --output-dir Persistence/Migrations
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/backend/German.Infrastructure/Persistence/Migrations
          if git diff --cached --quiet; then
            echo "No migration changes generated."
            exit 0
          fi
          git commit -m "chore: regenerate initial database migration"
          git push origin HEAD:feat/production-mvp
